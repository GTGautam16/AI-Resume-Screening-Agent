services:
  postgres:
    image: postgres:16

    container_name: resume-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gtpostgresql
      POSTGRES_DB: resume_agent

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  resume-agent:
    build: .

    depends_on:
      - postgres

    ports:
      - "8501:8501"

    env_file:
      - .env

volumes:
  postgres_data: